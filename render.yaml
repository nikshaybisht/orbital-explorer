# One-click deploy on Render: https://render.com
# Dashboard → New → Blueprint → connect this repo.
services:
  - type: web
    name: orbital-explorer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: gunicorn wsgi:server --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
